# The quality gate of this SDK: on every pull request, and in front of every
# publish (publish.yml calls this file), so nothing reaches npm unchecked.
#
# This file is generated by revenexx/sdk-generator from
# templates/web/.github/workflows/ci.yml; change it there.
#
# The steps are those of the organisation's shared Node gate
# (revenexx/.github, node-ci.yml), written out because that workflow cannot
# be called from this organisation yet. Once it can, the job below becomes
#
#   check:
#     uses: revenexx/.github/.github/workflows/node-ci.yml@v1
#
# and the concurrency block goes: node-ci.yml sets the same group itself, and
# the same group on both levels is cancelled as a deadlock.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (install · lint · types · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # Fails when package-lock.json does not match package.json, so a stale
      # lockfile is a gate failure rather than a silent fix.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build
