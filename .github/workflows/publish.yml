name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # The gate in front of the publish: the same checks a pull request runs
  # (ci.yml), in this run. A release that does not build or type-check never
  # reaches npm.
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    - name: Update npm to latest version for OIDC support
      run: npm install -g npm@latest

    - name: Determine release tag
      id: release_tag
      run: |
        if [[ "${{ github.ref }}" == *"-rc"* ]] || [[ "${{ github.ref }}" == *"-RC"* ]]; then
          echo "tag=next" >> "$GITHUB_OUTPUT"
        else
          echo "tag=latest" >> "$GITHUB_OUTPUT"
        fi

    # From the lockfile the gate checked, so what is published is what passed.
    - name: Install dependencies and build
      run: |
        npm ci
        npm run build

    - name: Publish
      run: npm publish --provenance --access public --tag ${{ steps.release_tag.outputs.tag }}
